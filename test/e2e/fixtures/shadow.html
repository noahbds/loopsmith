<!doctype html>
<html><head><meta charset="utf-8"><title>Fixture: shadow DOM player</title>
<style>body{margin:0;background:#222;color:#eee;font-family:sans-serif} fancy-player{display:block;width:960px;height:540px;margin:40px auto}</style>
<script>
customElements.define('fancy-player', class extends HTMLElement {
  connectedCallback() {
    const sr = this.attachShadow({ mode: 'open' });
    sr.innerHTML = '<style>video{width:100%;height:100%;background:#000}</style><video src="main.mp4" preload="metadata"></video>';
  }
});
</script></head>
<body><h1>Shadow player</h1><fancy-player></fancy-player></body></html>
