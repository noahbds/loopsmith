name: Feature request
description: An idea to make Loopsmith better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation (practising, listening, …) rather than the solution first.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
