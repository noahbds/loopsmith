name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the bundles parse
        run: npm run check
      - name: Validate the Firefox package (Mozilla's linter)
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --self-hosted=false
      - uses: actions/upload-artifact@v4
        with:
          name: loopsmith-packages
          path: |
            dist/loopsmith-chrome.zip
            dist/loopsmith-firefox.xpi
