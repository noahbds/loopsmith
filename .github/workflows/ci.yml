name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - run: npm run build
      - name: Check the bundles parse
        run: npm run check
      - name: Validate the Firefox package (Mozilla's linter)
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --self-hosted=false
      - uses: actions/upload-artifact@v7
        with:
          name: loopsmith-packages
          path: |
            dist/loopsmith-chrome.zip
            dist/loopsmith-firefox.xpi

  e2e:
    # Real Chromium against local test pages. Not required to merge yet: flaky timing shows up here first.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
